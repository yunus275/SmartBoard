<style>
:root{--bar:#eaf4f6;--ink:#44555b;--acc:#12b5a0;--seg:#d3e5e8;--bd:#b9ccd0;box-sizing:border-box}
:root[data-theme="dark"]{--bar:#273237;--ink:#d3e3e7;--seg:#38484f;--bd:#4a5a60}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#1c2629;overflow:hidden;font:12px system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
@keyframes appear{from{opacity:0;scale:.9}to{opacity:1;scale:1}}

.bar{position:fixed;background:var(--bar);border-radius:14px;display:flex;align-items:center;box-shadow:0 4px 18px #0009;overflow:auto;scrollbar-width:none;animation:appear .35s cubic-bezier(.2,1.2,.4,1) both;z-index:5;padding:2px}

.b:hover{transform:translateY(-2px)}.b:active{transform:scale(.88)}
.b.on{background:var(--acc);color:#fff}.b.on svg{animation:bounce .4s}
.pn{padding:4px 8px;font-size:13px;border:1px solid var(--bd);border-radius:8px;margin:2px;flex:0 0 auto}

#menu{position:fixed;top:50%;left:50%;width:min(580px,94vw);max-height:88vh;background:var(--bar);z-index:41;border-radius:14px;opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.92);transition:transform .3s cubic-bezier(.2,1.2,.4,1),opacity .25s;box-shadow:0 12px 50px #000c;overflow-y:auto;padding:14px 16px 18px}

.mh{display:flex;justify-content:space-between;align-items:center;font-size:17px;margin-bottom:4px}

.row{display:flex;gap:7px;margin:0 0 10px;flex-wrap:wrap;align-items:center}.row:last-child{margin:0}

.lbl{font-size:12px;min-width:34px}

/* ===== new splash ===== */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#2b3f47,#0b1114 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;clip-path:circle(150% at 50% 50%);transition:clip-path .95s cubic-bezier(.7,0,.2,1)}

.sp-logo .ring.r2{border-color:#ff5a5aaa;animation-delay:2.3s}

.sp-in h1{font-size:clamp(26px,5vw,46px);margin:22px 0 4px;letter-spacing:.04em;perspective:600px;font-weight:700}
.sp-in h1 b{display:inline-block;font-weight:700;white-space:nowrap}.sp-in h1 b.w2{color:#ff5a5a;margin-left:.3em}
.sp-in h1 em{display:inline-block;font-style:normal;opacity:0;animation:letter .8s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.8s + var(--i)*.05s)}
.sp-in p{margin:0;opacity:.7;font-size:14px;animation:up .8s 1.7s both}
.ld{width:min(260px,70vw);height:6px;border-radius:4px;background:#fff2;margin:26px auto 0;overflow:hidden;animation:up .6s 1.1s both;position:relative}
.ld i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d6bff,#b06cff,#ff5a5a);border-radius:4px;position:relative}
.ld i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 50%,transparent 70%);animation:shine 1.1s linear infinite}
.sp-st{margin-top:10px;font-size:12px;opacity:.65;letter-spacing:.06em;animation:up .6s 1.2s both;display:flex;justify-content:center;gap:8px}
.sp-st b{min-width:36px;text-align:right;font-weight:600}
@keyframes letter{from{opacity:0;transform:translateY(34px) rotateX(-90deg) scale(.6);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes ringP{0%{opacity:.85;transform:translate(-50%,-50%) scale(.55)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
body.boot .bar{opacity:0}

.wg{position:fixed;z-index:8;background:var(--bar);border-radius:18px;box-shadow:0 10px 34px #000a;display:flex;flex-direction:column;overflow:hidden;animation:wgIn .38s cubic-bezier(.2,1.3,.4,1) both;touch-action:none;border:1px solid var(--bd)}

.wh:active{cursor:grabbing}

.wrs{position:absolute;right:2px;bottom:2px;width:20px;height:20px;cursor:nwse-resize;opacity:.55;background:linear-gradient(135deg,transparent 52%,var(--ink) 52% 58%,transparent 58% 70%,var(--ink) 70% 76%,transparent 76%);border-radius:0 0 14px 0}
.wbtn{border:0;border-radius:13px;padding:10px 18px;background:var(--seg);color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,background .2s,opacity .2s}

.wbtn.pri{background:var(--acc);color:#fff}.wbtn.red{background:#e5484d;color:#fff}.wbtn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.wbtn.big{padding:12px 30px;font-size:16px}
.wbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wg input[type=text],.wg input[type=number]{-webkit-user-select:text;user-select:text;touch-action:auto;background:var(--bar);color:var(--ink);border:1px solid var(--bd);border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;min-width:0;outline:none}
.wg input[type=text]:focus,.wg input[type=number]:focus{border-color:var(--acc)}
.wheelbox{position:relative;line-height:0}
.wres{min-height:30px;font-size:17px;text-align:center;display:flex;align-items:center;justify-content:center;max-width:100%;overflow:hidden}
.wres b{color:var(--acc);animation:winPop .6s cubic-bezier(.2,1.6,.4,1) both;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.25em}
@keyframes winPop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.ed{width:100%;display:flex;flex-direction:column;gap:9px}
.addrow{display:flex;gap:7px;align-items:center;width:100%}.addrow input{flex:1}
.nl{display:flex;flex-direction:column;gap:6px;max-height:230px;overflow-y:auto;padding-right:2px;touch-action:pan-y}
.nl .it{display:flex;gap:6px;align-items:center}.nl .it input{flex:1}.nl .it span{width:22px;text-align:center;opacity:.55;font-size:11px}
.ck{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}.ck input{accent-color:var(--acc);width:17px;height:17px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tring{position:relative;width:calc(var(--w)*.6);aspect-ratio:1;margin-top:2px}

.tring circle{fill:none;stroke-width:6;stroke-linecap:round}
.tring .bg{stroke:var(--seg)}.tring .fg{stroke:var(--acc);transition:stroke .3s}
.tm{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.135);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.wg.low .tring .fg{stroke:#ff9a44}.wg.low .tm{color:#ff9a44}
.wg.done .tring .fg{stroke:#e5484d}.wg.done .tm{color:#e5484d;animation:blink .55s infinite}
@keyframes blink{50%{opacity:.25}}
.tin{display:flex;gap:8px;align-items:center;justify-content:center}.tin label{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;opacity:.9}.tin input{width:62px;text-align:center;font-size:18px!important}
.brow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#more{position:fixed;background:var(--bar);padding:8px;border-radius:14px;box-shadow:0 8px 30px #000b;display:none;z-index:21;gap:4px;flex-wrap:wrap;max-width:min(360px,94vw);justify-content:center}
#more.show{display:flex}
#toast{transform:translateX(-50%)}


/* ===== smart-board theme ===== */
:root[data-theme="dark"]{--bar:#d6ecf6;--ink:#5f8296;--seg:#bfe0ee;--bd:#a5cde0}
html,body{background:#171c1a}
.bar{border-radius:6px;padding:0;box-shadow:0 2px 10px #0009}

.b.on[data-k=pen]::after{content:"";position:absolute;top:9px;right:7px;border-left:5px solid #fff;border-top:3px solid transparent;border-bottom:3px solid transparent}

.b{color:#6aa5bd;font-size:10px}.b svg{color:#52b3d8;stroke-width:1.5;width:28px;height:28px}

#wd::after{content:"";position:absolute;left:var(--ax,50%);margin-left:-10px;border:10px solid transparent;display:none}

/* ===== same bar colors in light and dark mode (photo) ===== */
:root,:root[data-theme="dark"],:root[data-theme="light"]{--bar:#b9e1f6;--ink:#5c8aa6;--seg:#cfeafa;--bd:#9cc9e2;--acc:#2bb5b0}

.bar{background:linear-gradient(90deg,#a4d3ee,#c6eafc)}
.b{color:#6f9bb5}.b svg{color:#4fa8d0}.b.on,#wd .tile.on{background:#2bb5b0}.b.on svg{color:#fff}
#wd{background:#dff1fc}#wd.ab::after{border-top-color:#dff1fc}#wd.at::after{border-bottom-color:#dff1fc}

:root[data-theme="dark"] .bar{background:linear-gradient(90deg,#1a2830,#25373f)}

:root[data-theme="dark"] #wd{background:#22333d}
:root[data-theme="dark"] #wd.ab::after{border-top-color:#22333d}:root[data-theme="dark"] #wd.at::after{border-bottom-color:#22333d}
:root[data-theme="dark"] .pc.on{background:#35505e}
:root[data-theme="dark"] .bi svg{stroke:#6cc0e8;fill:#2d414d}:root[data-theme="dark"] .bi.on svg{stroke:#2bd0c0;fill:#1d8f86}
:root[data-theme="dark"] .bi svg text{fill:#6cc0e8}:root[data-theme="dark"] .bi.on svg text{fill:#2bd0c0}
:root[data-theme="dark"] #wd .tile{color:#6cc0e8}:root[data-theme="dark"] #wd .tile:hover{background:#2d414d}:root[data-theme="dark"] #wd .tile.on{background:#2bb5b0;color:#fff}
:root[data-theme="dark"] #wd input[type=range]{background:linear-gradient(90deg,#27c2b0 var(--p,50%),#3d5766 var(--p,50%))}
:root[data-theme="dark"] #wd .d{box-shadow:inset 0 0 0 1px #fff3}
:root[data-theme="dark"] #more{background:#1f2d36}:root[data-theme="dark"] #plist{background:#1f2d36}
:root[data-theme="dark"] .b.on{color:#fff}

/* ===== light mode (white, no blue) ===== */
:root[data-theme="light"]{--bar:#f3f6f7;--ink:#4a6572;--seg:#e3eaed;--bd:#c9d5da}
:root[data-theme="light"] .bar{background:linear-gradient(90deg,#f8fafb,#eaeff1)}
:root[data-theme="light"] .b{color:#60808e}:root[data-theme="light"] .b svg{color:#4d7a8c}
:root[data-theme="light"] .b.on{color:#fff;background:#2bb5b0}:root[data-theme="light"] .b.on svg{color:#fff}
:root[data-theme="light"] .pn{border-color:#c9d5da;color:#4a6572}
:root[data-theme="light"] #wd{background:#f8fafb}
:root[data-theme="light"] #wd.ab::after{border-top-color:#f8fafb}:root[data-theme="light"] #wd.at::after{border-bottom-color:#f8fafb}
:root[data-theme="light"] .pc.on{background:#e1ebef}
:root[data-theme="light"] .bi svg{stroke:#5a8799;fill:#eef3f5}:root[data-theme="light"] .bi.on svg{stroke:#12a493;fill:#38cfbd}
:root[data-theme="light"] .bi svg text{fill:#5a8799}:root[data-theme="light"] .bi.on svg text{fill:#12a493}
:root[data-theme="light"] #wd .tile{color:#4d7a8c}:root[data-theme="light"] #wd .tile:hover{background:#e3eaed}:root[data-theme="light"] #wd .tile.on{background:#2bb5b0;color:#fff}
:root[data-theme="light"] #wd input[type=range]{background:linear-gradient(90deg,#27c2b0 var(--p,50%),#d3dde1 var(--p,50%))}

/* ===== little animations ===== */
*:not(#splash):not(#splash *):not(.wg):not(.wg *):not(.b):not(.b *):not(.mb):not(.mb *):not(#menu):not(#menu *):not(#bk):not(#wd):not(#wd *):not(#more):not(#more *):not(#plist):not(#plist *),*:not(#splash):not(#splash *):not(.wg):not(.wg *):not(.b):not(.b *):not(.mb):not(.mb *):not(#menu):not(#menu *):not(#bk):not(#wd):not(#wd *):not(#more):not(#more *):not(#plist):not(#plist *)::before,*:not(#splash):not(#splash *):not(.wg):not(.wg *):not(.b):not(.b *):not(.mb):not(.mb *):not(#menu):not(#menu *):not(#bk):not(#wd):not(#wd *):not(#more):not(#more *):not(#plist):not(#plist *)::after{animation:none!important;transition:none!important}
.b{overflow:hidden;transition:transform .12s ease,background .18s,color .18s}.b:hover{transform:none}.b:active{transform:scale(.9)}
.b.on svg{animation:ico .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes ico{from{transform:scale(.55) rotate(-12deg)}to{transform:none}}
.b::before{content:"";position:absolute;left:50%;top:42%;width:6px;height:6px;margin:-3px;border-radius:50%;background:currentColor;opacity:0;pointer-events:none}
.b:active::before{animation:rip .4s ease-out}
@keyframes rip{from{opacity:.4;transform:scale(1)}to{opacity:0;transform:scale(11)}}
#more.show{animation:pop .18s cubic-bezier(.2,1.3,.4,1)}
#plist.show{animation:slideL .24s cubic-bezier(.22,1,.36,1)}@keyframes slideL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
/* settings drawer on the right */
#menu{top:0;bottom:0;right:0;left:auto;width:min(410px,92vw);max-height:none;height:100%;border-radius:12px 0 0 12px;opacity:1;transform:translateX(106%);transition:transform .34s cubic-bezier(.22,1,.36,1);box-shadow:-10px 0 40px #0009}
#menu.open{opacity:1;transform:none}
#bk{transition:opacity .3s}
#menu.open .mb,#menu.open .mh{animation:mbIn .38s cubic-bezier(.22,1,.36,1) both}
#menu.open .mb:nth-child(2){animation-delay:.04s}#menu.open .mb:nth-child(3){animation-delay:.07s}#menu.open .mb:nth-child(4){animation-delay:.10s}#menu.open .mb:nth-child(5){animation-delay:.13s}#menu.open .mb:nth-child(n+6){animation-delay:.16s}
@keyframes mbIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
#plist{max-width:calc(100vw - 16px)}
#plist .cols{display:flex;gap:8px;flex:1;min-height:0;padding:0 8px 8px}
#plist .sec{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;gap:6px}
#plist .st{font-size:11px;font-weight:700;color:var(--ink);padding:2px 2px 0}
#plist .sec .pl{flex:1;overflow-y:auto;padding:2px;display:flex;flex-direction:column;gap:8px}

 const run=(m,f)=>open().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
 return{get:k=>run('readonly',s=>s.get(k)),set:(k,v)=>run('readwrite',s=>s.put(v,k)),del:k=>run('readwrite',s=>s.delete(k))}})();
let sbReady=false,sbDirty=0,pdfStored=false;
const PKEYS=['tool','brush','color','width','esize','emode','shape','rst'];
const pick=p=>{const o={};PKEYS.forEach(k=>o[k]=p[k]);return o};
function snapState(){
 const pg=p=>({cur:p.cur,pages:p.pages.map(g=>({s:g.s})),...pick(p)});
 return{v:1,swipe:swipeNav,theme,bg,grid,BP,lmode:PD.pages.length?lmode:'full',dr,splitOn:splitOn&&!PD.pages.length,
  panes:{M:pg(M),B2:pg(B2),P1:pg(P1),P2:pg(P2)},pdf:PD.pages.length?pg(PD):null}}
function sbSave(){if(!sbReady)return Promise.resolve();
 const ps=[kv.set('state',snapState())];
 if(!PD.pages.length&&pdfStored){pdfStored=false;ps.push(kv.del('pdf'))}
 return Promise.all(ps).catch(()=>{})}
window.sbFlush=()=>{sbDirty=0;return sbSave()};
['pointerup','click','keydown','change','input'].forEach(ev=>addEventListener(ev,()=>sbDirty=1,true));
setInterval(()=>{if(sbDirty){sbDirty=0;sbSave()}},2500);
addEventListener('pagehide',()=>{sbSave()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)sbSave()});

async function loadPdf(buf,saved){
 const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise,np=[];
 for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i),vp=pg.getViewport({scale:1}),g=mk();g.pdf=pg;g.lw=1600;g.lh=1600*vp.height/vp.width;if(saved&&saved.pages[i-1])g.s=saved.pages[i-1].s||[];np.push(g)}
 PD.pages=np;PD.cur=saved?cl(saved.cur||0,0,np.length-1):0;PD.z=1;PD.px=PD.py=0;split=splitOn=false;splitX=W;sel=null}
document.getElementById('f').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 try{const buf=await f.arrayBuffer();await loadPdf(buf);lmode='full';rebuild();toast('PDF opened — Settings › PDF to split it with a board');
  await kv.set('pdf',buf.slice(0));pdfStored=true;sbDirty=1}catch(err){toast('Could not open this PDF')}
 e.target.value=''};

async function applyState(s,buf,fromFile){
 sel=null;widget(null);
 if(!fromFile){swipeNav=false;theme=s.theme||theme;document.documentElement.dataset.theme=theme;grid=!!s.grid;BP=s.BP||BP;dr=s.dr||dr}
 bg=s.bg||bg;
 ['M','B2','P1','P2'].forEach(id=>{const d=s.panes&&s.panes[id],p=PN[id];if(!d)return;
  p.pages=d.pages&&d.pages.length?d.pages.map(x=>Object.assign(mk(),{s:x.s||[]})):[mk()];p.cur=cl(d.cur||0,0,p.pages.length-1);
  PKEYS.forEach(k=>{if(d[k]!=null)p[k]=d[k]});if(p.brush=='neon')p.brush='pen';if(p.tool=='move'||p.tool=='table')p.tool='pen'});
 if(buf){try{await loadPdf(buf,s.pdf);pdfStored=true;lmode=s.lmode||'full';PKEYS.forEach(k=>{if(s.pdf[k]!=null)PD[k]=s.pdf[k]});if(fromFile)await kv.set('pdf',buf.slice(0))}catch(e){toast('The PDF inside could not be opened')}}
 else{PD.pages=[];if(fromFile){split=splitOn=false}else if(s.splitOn){split=splitOn=true;splitX=W}}
 rebuild();sbDirty=1}
async function sbRestore(){try{const s=await kv.get('state');if(s){const buf=s.pdf?await kv.get('pdf'):null;await applyState(s,buf,false)}}catch(e){}sbReady=true}
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key=='0'){resetView(1);e.preventDefault()}});
sbRestore();
let wheelT=0;cv.addEventListener('wheel',e=>{if(!swipeNav)return;const p=paneAt(e.clientX,e.clientY);if(!pgOf(p).pdf||p.z>1.08)return;e.preventDefault();const t=performance.now();if(t-wheelT<350)return;wheelT=t;go(p.id,e.deltaY>0?1:-1)},{passive:false});

</script><script>

/* ---------- table object ---------- */
function tblG(s){const a=s.p[0][0],b=s.p[0][1],x=Math.min(a[0],b[0]),y=Math.min(a[1],b[1]),w=Math.abs(b[0]-a[0]),h=Math.abs(b[1]-a[1]);return{x,y,w,h,cw:w/s.cn,ch:h/s.r}}

function drawTbl(c,s){const g=tblG(s),col=hx(s.c);c.save();c.globalAlpha=s.a;
 for(let r=0;r<s.r;r++)for(let k=0;k<s.cn;k++){const f=s.cf&&s.cf[r+','+k];if(f)c.fillStyle=f;else if(r==0&&s.hd)c.fillStyle='rgba('+col+',.22)';else continue;c.fillRect(g.x+k*g.cw,g.y+r*g.ch,g.cw,g.ch)}
 c.strokeStyle=s.c;c.lineJoin='round';c.beginPath();for(let r=1;r<s.r;r++){c.moveTo(g.x,g.y+r*g.ch);c.lineTo(g.x+g.w,g.y+r*g.ch)}for(let k=1;k<s.cn;k++){c.moveTo(g.x+k*g.cw,g.y);c.lineTo(g.x+k*g.cw,g.y+g.h)}c.lineWidth=Math.max(1.5,s.w*.6);c.stroke();
 if(s.hd&&s.r>1){c.beginPath();c.moveTo(g.x,g.y+g.ch);c.lineTo(g.x+g.w,g.y+g.ch);c.lineWidth=s.w*1.3;c.stroke()}
 c.lineWidth=s.w*1.5;c.strokeRect(g.x,g.y,g.w,g.h);
 if(s.tx){c.fillStyle=s.c;c.textAlign='center';c.textBaseline='middle';for(const key in s.tx){const t=s.tx[key],a=key.split(',').map(Number);if(!t||a[0]>=s.r||a[1]>=s.cn)continue;c.font=(a[0]==0&&s.hd?'700 ':'500 ')+Math.min(g.ch*.5,g.cw*.22)+'px system-ui,sans-serif';let u=t;while(u.length>1&&c.measureText(u).width>g.cw*.9)u=u.slice(0,-1);c.fillText(u,g.x+(a[1]+.5)*g.cw,g.y+(a[0]+.5)*g.ch)}}
 c.restore()}
function hposT(s){const g=tblG(s);return{siz:[g.x+g.w+16,g.y+g.h+16],ar:[g.x+g.w/2,g.y+g.h+26],ac:[g.x+g.w+26,g.y+g.h/2]}}
function hpickT(s,q,sc){const h=hposT(s),R=26/sc;for(const k of['siz','ar','ac'])if(Math.hypot(q[0]-h[k][0],q[1]-h[k][1])<R)return k=='siz'?'tsz':k=='ar'?'tar':'tac';return null}
function handlesT(c,s,sc){const h=hposT(s),R=15/sc;c.setLineDash([]);[['siz',h.siz],['ar',h.ar],['ac',h.ac]].forEach(([k,P])=>{c.beginPath();c.arc(P[0],P[1],R,0,7);c.fillStyle='#12b5a0';c.fill();c.strokeStyle='#fff';c.lineWidth=2/sc;c.stroke();
 c.save();c.translate(P[0],P[1]);c.scale(R/12,R/12);c.strokeStyle='#fff';c.lineWidth=2;c.lineCap='round';c.lineJoin='round';c.beginPath();
 if(k=='siz'){c.moveTo(-4,4);c.lineTo(4,-4);c.moveTo(0,-4);c.lineTo(4,-4);c.lineTo(4,0);c.moveTo(-4,0);c.lineTo(-4,4);c.lineTo(0,4)}else{c.moveTo(-5,0);c.lineTo(5,0);c.moveTo(0,-5);c.lineTo(0,5)}c.stroke();c.restore()})}
function tblAdd(p,kind){const g=pgOf(p),o=sel.s,t=tblG(o);snap(g);const n={...o,p:[[[...o.p[0][0]],[...o.p[0][1]]]],tx:{...o.tx},cf:{...o.cf}};if(kind=='r'){n.r++;n.p[0][1][1]+=t.ch}else{n.cn++;n.p[0][1][0]+=t.cw}g.s[g.s.indexOf(o)]=n;sel.s=n;dirty=1}
function editCell(p,q){const s=sel.s,g=tblG(s),k=Math.floor((q[0]-g.x)/g.cw),r=Math.floor((q[1]-g.y)/g.ch);if(r<0||k<0||r>=s.r||k>=s.cn)return;
 const t=tf(p),inp=document.createElement('input');inp.type='text';inp.maxLength=60;inp.value=(s.tx&&s.tx[r+','+k])||'';
 Object.assign(inp.style,{position:'fixed',left:(g.x+k*g.cw)*t.sc+t.ox+'px',top:(g.y+r*g.ch)*t.sc+t.oy+'px',width:g.cw*t.sc+'px',height:g.ch*t.sc+'px',zIndex:60,font:'600 '+Math.max(12,Math.min(g.ch*t.sc*.45,28))+'px system-ui',textAlign:'center',border:'2px solid #2bb5b0',borderRadius:'4px',background:'#fff',color:'#111',boxSizing:'border-box',padding:'0 4px',outline:'none'});
 let done=0;const fin=ok=>{if(done)return;done=1;if(ok){const gg=pgOf(p),i=gg.s.indexOf(s);if(i>=0){snap(gg);const n={...s,tx:{...s.tx,[r+','+k]:inp.value}};gg.s[i]=n;if(sel&&sel.s===s)sel.s=n}}inp.remove();dirty=1};
 inp.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')fin(1);if(e.key=='Escape')fin(0)};inp.onblur=()=>fin(1);document.body.appendChild(inp);inp.focus();inp.select()}
function insertTable(p){const T=p.tbl||(p.tbl={r:4,c:4}),v=viewC(p),g=pgOf(p),t=tf(p),vw=g.pdf?g.lw:p.w/t.sc,vh=g.pdf?g.lh:p.h/t.sc,
 cw=Math.min(130*v.f,vw*.8/T.c),ch=Math.min(56*v.f,vh*.6/T.r),w=cw*T.c,h=ch*T.r,x0=v.cx-w/2,y0=v.cy-h/2;
 addObj(p,{k:'tbl',c:p.color,w:3,a:1,r:T.r,cn:T.c,hd:1,tx:{},cf:{},p:[[[x0,y0],[x0+w,y0+h]]]})}
function insertMind(p){const v=viewC(p),f=v.f,P=[],el=(x,y,w,h)=>shp('ellipse',[x-w/2,y-h/2],[x+w/2,y+h/2])[0],cx=v.cx,cy=v.cy;
 P.push(el(cx,cy,230*f,120*f));[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([a,b])=>{const x=cx+a*330*f,y=cy+b*200*f;P.push(el(x,y,200*f,100*f));P.push([[cx+a*95*f,cy+b*38*f],[x-a*85*f,y-b*28*f]])});
 addObj(p,{k:'pen',c:p.color,w:3,a:1,p:P})}
const NOTE=['#ffe66d','#9be87a','#ff9ec4','#7fd6ff'];

 addObj(p,{k:'pen',c:'#00000040',w:2,a:1,cl:1,fill:NOTE[n%4],p:[[[x,y],[x+s,y],[x+s,y+s],[x,y+s],[x,y]]]},'pen');p.color='#222222';aps().forEach(render);toast('Sticky note added — write on it with the pen')}
function togglePreview(){document.body.classList.toggle('pv');aps().forEach(render);dirty=1;if(document.body.classList.contains('pv'))toast('Preview mode — tap the corner button to exit')}
const plEl=document.createElement('div');plEl.id='plist';document.body.appendChild(plEl);
const PNAME={M:'Board',PD:'PDF',B2:'Board',P1:'Student 1',P2:'Student 2'};
function buildList(){const ps=aps();plEl.style.width=(ps.length>1?364:184)+'px';plEl.innerHTML='<h5><span>Pages</span><span style="cursor:pointer;padding:0 4px" onclick="openList()">✕</span></h5><div class="cols"></div>';const cols=plEl.querySelector('.cols');
 ps.forEach(p=>{const sec=document.createElement('div'),pdf=!!p.pages[0].pdf;sec.className='sec';sec.innerHTML='<div class="st">'+PNAME[p.id]+' · '+p.pages.length+'</div><div class="pl"></div>'+(pdf?'':'<button class="wbtn sm">+ Add page</button>');
  const box=sec.querySelector('.pl');
  p.pages.forEach((g,i)=>{const d=document.createElement('div');d.className='pi'+(i==p.cur?' on':'');const c=document.createElement('canvas'),tw=240,th=g.pdf?Math.round(tw*g.lh/g.lw):Math.round(tw*p.h/p.w);c.width=tw;c.height=th;const x=c.getContext('2d');
   x.fillStyle=g.pdf?'#fff':bg;x.fillRect(0,0,tw,th);if(g.pdf&&g.img)x.drawImage(g.img,0,0,tw,th);const k=g.pdf?tw/g.lw:tw/p.w;x.scale(k,k);
   g.s.forEach(s=>{if(!s.e){try{dst(x,s)}catch(e){}}});d.appendChild(c);d.insertAdjacentHTML('beforeend','<i>'+(i+1)+'</i>');d.onclick=()=>{go(p.id,i-p.cur);buildList()};box.appendChild(d)});
  const ab=sec.querySelector('button');if(ab)ab.onclick=()=>{addp(p.id);buildList()};cols.appendChild(sec)})}

 if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Aymen Schoolboard'}).catch(()=>{});else saveBoard()})}

 Promise.resolve(window.sbFlush&&sbFlush()).then(()=>{try{window.close()}catch(e){}setTimeout(closedScreen,350)})}

<script>
/* ---------- board files (.aymn) ---------- */
const hasCS=typeof CompressionStream!='undefined';
async function pipeBytes(T,u){const w=T.writable.getWriter();w.write(u);w.close();return new Uint8Array(await new Response(T.readable).arrayBuffer())}
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64u8=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function saveFile(){
 try{const st=snapState();let pdf=null;if(PD.pages.length){const buf=await kv.get('pdf');if(buf)pdf=u8b64(new Uint8Array(buf))}
  let bytes=new TextEncoder().encode(JSON.stringify({aymn:1,date:new Date().toISOString(),state:st,pdf}));if(hasCS)bytes=await pipeBytes(new CompressionStream('gzip'),bytes);
  const name='board-'+new Date().toISOString().slice(0,10)+'.aymn';
  if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'Aymen board',accept:{'application/octet-stream':['.aymn']}}]});const w=await h.createWritable();await w.write(bytes);await w.close();toast('Saved '+h.name);return}catch(e){if(e&&e.name=='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Saved '+name)
 }catch(e){toast('Could not save the file')}}
function openFilePicker(){const i=document.createElement('input');i.type='file';i.accept='.aymn';i.onchange=()=>{if(i.files[0])loadAymn(i.files[0])};i.click()}
async function loadAymn(f,silent){
 try{let u=new Uint8Array(await f.arrayBuffer());if(u[0]==0x1f&&u[1]==0x8b)u=await pipeBytes(new DecompressionStream('gzip'),u);
  const o=JSON.parse(new TextDecoder().decode(u));if(!o||o.aymn!==1||!o.state)throw 0;
  if(!silent&&!confirm('Open "'+f.name+'"?\nThis replaces the board you have now.'))return;
  await applyState(o.state,o.pdf?b64u8(o.pdf).buffer:null,true);toast('Opened '+f.name)
 }catch(e){toast('This is not a valid .aymn file')}}
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&/\.aymn$/i.test(f.name))loadAymn(f)});
(()=>{const op=new URLSearchParams(location.search).get('open');if(!op)return;const t=setInterval(()=>{if(!sbReady)return;clearInterval(t);fetch(op).then(r=>r.arrayBuffer()).then(b=>loadAymn(new File([b],decodeURIComponent(op.split('/').pop())),true)).catch(()=>toast('Could not open the file'))},200)})();

</script>
